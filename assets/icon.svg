    <path d="M16 6.5c-4.4 0-7.5 3.4-7.5 8v4.2L6.6 21.6c-.4.6 0 1.4.8 1.4h17.2c.8 0 1.2-.8.8-1.4l-1.9-2.9v-4.2c0-4.6-3.1-8-7.5-8Z"/>
    <circle cx="16" cy="25.6" r="1.9"/>
  </g>
</svg>
